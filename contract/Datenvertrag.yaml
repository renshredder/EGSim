openapi: 3.1.0
info:
  title: Handelsplattform Energiegemeinschaften
  version: 0.3.1
  description: |
    Gemeinsamer Datenvertrag der Handelsplattformen (Entwurf 0.3.1).

    Grundlage ist die korrigierte Fassung 0.2 vom 19.11.2026. Version 0.3 setzt die Rückmeldung der Energiegemeinschaft eg-mmm vom 20.11.2026 um. Version 0.3.1 korrigiert nur Unklarheiten und Widersprüche in 0.3, ohne eine fachliche Regel zu ändern (siehe Abstimmungsprotokoll).
    Grundlage dafür ist die Laboraufgabe Rev. 2 („Laboraufgabe (Handelsplattform)“, Update 13.10.2026, 21 Folien).
    Jede Änderung und ihre Quelle steht im Abstimmungsprotokoll. **(Vorschlag)** kennzeichnet Punkte, die noch nicht gemeinsam beschlossen sind.

    ## Geltungsbereich
    Der Vertrag beschreibt die Daten, die Energiegemeinschaften (EGs) und Handelsplattformen austauschen, und deren Bedeutung.
    Wie eine Plattform intern Preise bildet und Mengen zuteilt, legt jede Gruppe selbst fest (Laboraufgabe Folie 8, 14).
    Verbindlich sind nur die Invarianten im Abschnitt „Handelslogik“.

    ## Allgemeine Konventionen
    - Format: JSON in UTF-8, Feldnamen in camelCase
    - Sprache: Diese Beschreibung ist deutsch. Feldnamen, Statuswerte, Fehlercodes und Fehlermeldungen (`message`) sind englisch
    - Alle IDs sind UUIDs (RFC 9562). Eigene Kennung einer Ressource heißt immer `id`, Verweise heißen `energyCommunityId` bzw. `positionId`
    - Plattformübergreifende EG-Kennung: `communityCode` (siehe „Energiegemeinschaften“)
    - `deliveryDate`: `YYYY-MM-DD`, Liefertag nach Europe/Vienna
    - Zeitstempel: RFC 3339 (`date-time`), bevorzugt UTC
    - Mengen in kWh (höchstens 3 Nachkommastellen), Preise in EUR/kWh (höchstens 5), Beträge in EUR (2)
    - Mengen, Preise und Beträge sind JSON-Zahlen. Server **und** Clients rechnen mit Dezimaltypen, nicht mit Gleitkommazahlen
    - Anmeldung: Web-UI mit `POST /auth/login` (E-Mail und Passwort), danach `Authorization: Bearer <token>`; `POST /auth/logout` macht das Token sofort ungültig. Systeme nutzen den API-Key im Header `X-API-Key`. Alle Endpoints außer Registrierung, Login und `/health/*` brauchen eines von beiden
    - Rollen: `ADMIN` und `ENERGY_COMMUNITY`. Die Rolle ergibt sich aus den Zugangsdaten, `GET /me` zeigt sie an. Jeder Endpoint nennt die erlaubten Rollen in `x-roles`
    - Registrierung: EGs registrieren sich selbst (`POST /energy-communities`, Status `PENDING`). Der Admin schaltet sie mit `PUT /energy-communities/{id}/status` frei (`ACTIVE`) und vergibt API-Key und Passwort (`POST /energy-communities/{id}/credentials`)
    - Zugangsdaten werden nur über einen vereinbarten sicheren Kanal übergeben, nie per Chat, Ticket oder E-Mail im Klartext
    - Der Admin-Account (E-Mail, Passwort, API-Key) wird vom Betreiber konfiguriert (z. B. Kubernetes-Secret)
    - Eine EG sieht und ändert nur ihre eigenen Daten, fremde Daten: `403` (siehe „Mandantentrennung“)
    - Nur `ACTIVE`-EGs können sich anmelden und Positionen einreichen, ändern oder stornieren
    - Nur der Admin darf EGs auflisten, löschen, den Status ändern, Zugangsdaten vergeben, Märkte schließen und das Tagesergebnis abrufen
    - Pro EG und Liefertag genau eine Position (`OFFER` oder `DEMAND`); bei der optionalen Erweiterung `QUARTER_HOUR` eine pro Intervall
    - Ob eine Position angenommen wird, hängt nur vom Markt ab: Er muss `OPEN` sein und `closesAt` darf nicht erreicht sein. Das Kalenderdatum allein ist kein Ablehnungsgrund, denn Marktläufe können auch historische Liefertage handeln

    ## Versionierung und Kompatibilität (Vorschlag)
    - Jede Antwort trägt den Header `Api-Version` mit der Vertragsversion (z. B. `0.3.1`).
    - Innerhalb einer Hauptversion (z. B. 1.x) sind nur abwärtskompatible Änderungen erlaubt: neue optionale Request-Felder, neue Antwortfelder, neue Endpoints und neue Query-Parameter.
    - Nicht erlaubt sind: Felder entfernen oder umbenennen, neue Pflichtfelder im Request, Bedeutung oder Einheit ändern, Wertebereiche einschränken.
    - Clients ignorieren unbekannte Antwortfelder. Neue Statuswerte oder Fehlercodes gibt es nur mit einer neuen Hauptversion.
    - Pfadpräfix `/v1` ab Version 1.0: offen, siehe Abstimmungsprotokoll.

    ## Request-ID und Protokollierung
    - Clients dürfen den Header `X-Request-Id` mitschicken (1–128 Zeichen). Fehlt er, erzeugt der Server eine UUID.
    - Jede Antwort enthält `X-Request-Id`, jede Fehlerantwort zusätzlich das Feld `requestId` mit demselben Wert.
    - Jede Antwort `401` und `403` wird mit Request-ID, Zeitpunkt, angemeldeter Identität (falls vorhanden), Endpoint und Ziel-EG protokolliert. Zugangsdaten erscheinen nie im Log.

    ## Idempotenz und Wiederholungen
    Wiederholte Requests dürfen kein zweites Geschäft erzeugen (Laboraufgabe Folie 9, 12, 15).
    - `POST /positions` verlangt den Header `Idempotency-Key` (UUID). Bei `POST /energy-communities` ist er optional.
    - Gleicher Key und gleicher Inhalt: Der Server führt nichts erneut aus und liefert dieselbe Antwort (Status und Body) wie beim ersten Mal.
    - Gleicher Key und anderer Inhalt: `409 IDEMPOTENCY_KEY_REUSED`, es wird nichts gespeichert.
    - Gleicher Inhalt heißt: Der Request-Body ist nach dem Parsen als JSON gleich. Reihenfolge der Felder, Leerzeichen und Zahlenschreibweise (`120` und `120.0`) spielen keine Rolle.
    - Ein Key gilt pro angemeldeter Identität (EG bzw. Admin). Bei der Registrierung gibt es noch keine Identität, dort gilt der Key plattformweit. Der Server bewahrt ihn mindestens bis zum Settlement des Liefertags auf, bei der Registrierung mindestens 24 Stunden.
    - Gespeichert wird die erste endgültige Antwort (`2xx` oder `4xx`). Nicht gespeichert werden `401`, `403` (Rolle, EG nicht aktiv) und `429`, weil sie vor der Idempotenzprüfung entstehen. Nach `5xx` darf der Client mit demselben Key erneut senden.
    - Eine Wiederholung mit gleichem Key und gleichem Inhalt liefert die gespeicherte Antwort auch dann, wenn sich der Zustand inzwischen geändert hat. Beispiel: Die erste Einreichung ergab `201`, die Wiederholung kommt nach `closesAt` und erhält trotzdem dieselbe `201` statt `409 MARKET_CLOSED`.
    - Parallele Requests mit demselben Key verarbeitet der Server nacheinander. Die Plattform muss parallele Einreichungen so verarbeiten, dass keine Überbuchung entsteht.
    - Alle anderen schreibenden Endpoints sind von sich aus idempotent: `PUT` ersetzt den Zustand, `DELETE /positions/{id}` auf eine schon stornierte Position liefert `200` ohne Änderung, `close` rechnet nicht doppelt.

    ## Marktanlage und Preise
    Der Betreiber legt einen Markt pro `deliveryDate` außerhalb dieser API an, bevor Positionen angenommen werden, z. B. über Deployment-Konfiguration oder einen betrieblichen Initialisierungsprozess.
    Dabei legt er `resolution`, `closesAt` und die Preisparameter der Plattform fest. Ein Markt wird erst nach vollständiger Konfiguration als `OPEN` bereitgestellt.
    Bis dahin antworten `GET /markets/{deliveryDate}` und `POST /positions` mit `404 MARKET_NOT_FOUND`. Die Auflösung bleibt ab Marktöffnung unverändert.
    Welche Liefertage gehandelt werden, geben die Lehrenden vor. Offene Märkte findet eine EG mit `GET /markets?status=OPEN`.

    Preise bildet jede Plattform selbst: ein einheitlicher Tagespreis oder differenzierte Preise sind möglich (Folie 13, 14).
    - `Market.prices` ist optional, eine **Preisindikation** vor Marktschluss. Eine Plattform mit festen Preisen gibt hier ihre festen Preise an.
    - Verbindlich ist der Preis jedes Handelsabschlusses (`Trade.priceEurPerKwh`).
    - `MarketResult.prices` zeigt die durchschnittlichen Preise des Tages, gewichtet nach Menge. Ein Preis ist `null`, wenn es in dieser Richtung kein Geschäft gab, z. B. ohne Nachfrage kein Verkaufspreis.

    ## Zeitliche Auflösung
    - `DAY` (Tagesmarkt) ist der verbindliche Standard. Positionen haben kein `intervalStart` (in Antworten `null`).
    - `QUARTER_HOUR` ist eine **optionale Erweiterung** und nicht Teil des Mindestumfangs. Eine Plattform, die sie nicht anbietet, legt keine solchen Märkte an. Bei `QUARTER_HOUR` gibt es 96 Intervalle pro Liefertag (92 bzw. 100 an den Tagen der Zeitumstellung) und jede Position braucht `intervalStart`.
    - `intervalStart` ist ein UTC-Zeitstempel auf einer vollen Viertelstunde im Liefertag nach Europe/Vienna. Fehlt er bei `QUARTER_HOUR`, ist er bei `DAY` angegeben oder liegt er außerhalb des Liefertags: `400 INVALID_INTERVAL`.
    - Bei `QUARTER_HOUR` gelten Invarianten und Reserve je Intervall. Zuteilungen und Handelsabschlüsse enthalten `intervalStart`, das Tagesergebnis zusätzlich `intervals`.

    ## Handelslogik
    Die Plattform ist Gegenpartei aller Geschäfte. Sie kauft von anbietenden EGs (`PLATFORM_BUYS`) und verkauft an nachfragende EGs (`PLATFORM_SELLS`). Fehlende Mengen erzeugt ihr Reservekraftwerk.

    **Preisvorstellung.** `priceExpectationEurPerKwh` ist optional und nur informativ. Sie ist kein Mindestpreis (Folie 4).
    Eine Plattform darf sie in ihrer eigenen Zuteilungsregel verwenden, z. B. zur Reihung bei Überangebot (Folie 14).
    Ein Angebot darf aber nicht allein deshalb ungehandelt bleiben, weil seine Preisvorstellung über dem Ankaufspreis liegt.
    Verbindliche Mindest- oder Höchstpreise sind nur als gemeinsam abgestimmte Erweiterung zulässig.

    **Verbindliche Invarianten** (Folie 13, 14, 15; bei `QUARTER_HOUR` je Intervall). `S` = Summe aller Angebote, `D` = Summe aller Bedarfe:
    1. Berücksichtigt werden nur Positionen mit Status `CLOSED`.
    2. Keine Zuteilung ist größer als die eingereichte Menge.
    3. Die Plattform kauft insgesamt `min(S, D)`, nie mehr als benötigt.
    4. Reserve: `requiredKwh = max(D - S, 0)`. Ohne Nachfrage gibt es weder Ankauf noch Kraftwerkseinsatz.
    5. Im Standardfall wird jeder Bedarf vollständig gedeckt. Liefert das Kraftwerk weniger (`PARTIAL`, `UNAVAILABLE`), kürzt die Plattform die Bedarfe nach ihrer dokumentierten Regel (`reason: RESERVE_SHORTAGE`).
    6. Summen sind konsistent: `totalPurchasedKwh` = Summe der `PLATFORM_BUYS`, `totalSoldKwh` = Summe der `PLATFORM_SELLS`.
    7. Jeder Betrag ist Menge × Preis, kaufmännisch auf 0,01 EUR gerundet (pro Handelsabschluss).
    8. `marginEur = salesRevenueEur - purchaseCostEur - reserve.costEur`.
    9. Gleiche Eingaben und Parameter liefern dasselbe Ergebnis.

    **Handelsabschlüsse.** Jeder Trade verweist mit `positionId` auf seine Position. Pro gekauftem Angebot gibt es mindestens einen Trade `PLATFORM_BUYS`, pro gedecktem Bedarf mindestens einen Trade `PLATFORM_SELLS`.
    Mengen aus der Reserve tragen `fromReserve: true`. Mengen von 0 kWh erzeugen keinen Trade, nur eine Zuteilung.

    **Referenzbeispiel Gruppe 1 (nicht verbindlich).** Gruppe 1 setzt die Invarianten so um:
    - Pro Markt gibt es feste Preise für Ankauf, Verkauf und Reserve. Sie stehen ab Öffnung in `Market.prices`.
    - Bei `S > D` erhält jedes Angebot denselben Anteil `D / S` (pro rata).
    - Mengen werden auf 0,001 kWh abgerundet. Den Rest verteilt die Plattform in Schritten von 0,001 kWh nach `createdAt` (bei Gleichstand nach `id`).
    - Ein gedeckter Bedarf erhält einen Trade aus Angeboten und, falls nötig, einen zweiten aus der Reserve, beide zum Verkaufspreis. Der Reserveanteil wird pro rata auf die Bedarfe verteilt.
    Beispiel Überangebot: Angebote 100 kWh und 60 kWh, Bedarf 120 kWh, Anteil 0,75, Zuteilung 75 kWh und 45 kWh, keine Reserve.

    ## Nachvollziehbarkeit
    Für jeden Liefertag speichert die Plattform dauerhaft (Folie 12, 16):
    - die eingegangenen Positionen mit allen Änderungen und Stornierungen
    - Marktschluss, Zuteilungen, Reserveeinsatz, Handelsabschlüsse und Tagesergebnis
    - die verwendeten Preisparameter und die Version ihrer Preis- und Zuteilungsregel (`MarketResult.ruleVersion`)
    - Statuswechsel von EGs mit Zeitpunkt und auslösender Identität
    - Fehler und abgelehnte Zugriffe mit Request-ID

    ## Energiegemeinschaften
    - `communityCode` ist die plattformübergreifende Kennung einer EG (z. B. `eg-mmm`). Die EG wählt ihn bei der Registrierung und verwendet auf allen drei Plattformen denselben. (Vorschlag)
    - Erlaubt: Kleinbuchstaben, Ziffern und einzelne Bindestriche, 3–40 Zeichen. Der Code ist pro Plattform eindeutig, unveränderlich und in jeder EG-Antwort enthalten. Bereits vergeben: `409 COMMUNITY_CODE_ALREADY_REGISTERED`.
    - `id` bleibt die interne UUID der jeweiligen Plattform.
    - `PUT /energy-communities/{id}` ändert nur das Profil (`name`, `description`). `status` und `communityCode` sind dort nicht erlaubt (`400 VALIDATION_FAILED`).
    - Den Status ändert nur der Admin über `PUT /energy-communities/{id}/status`. Erlaubt sind `PENDING → ACTIVE`, `PENDING → SUSPENDED`, `ACTIVE → SUSPENDED`, `SUSPENDED → ACTIVE`. Zurück zu `PENDING` geht nicht, andere Übergänge ergeben `409 INVALID_STATUS_TRANSITION`. Wird derselbe Status erneut gesetzt, antwortet der Server mit `200` ohne Änderung.
    - Positionen einer EG, die beim Marktschluss nicht `ACTIVE` ist, werden `REJECTED` (`rejectionReason: ENERGY_COMMUNITY_NOT_ACTIVE`).

    ## Mandantentrennung und Berechtigungen
    Alle Berechtigungen prüft der Server. Ausgeblendete Buttons in der UI ersetzen keine Prüfung.
    - Welche EG anfragt, ergibt sich nur aus API-Key bzw. Token, nie aus Pfad, Query oder Body.
    - `POST /positions`: Für eine EG ist `energyCommunityId` optional. Fehlt sie, setzt der Server die eigene ID ein. Ist eine fremde ID angegeben: `403 FORBIDDEN`, es wird nichts gespeichert. Der Admin reicht keine Positionen ein (`403 FORBIDDEN`).
    - Listen (`GET /positions`, `/allocations`, `/trades`): Für eine EG filtert der Server immer auf die eigene EG. Ein Filter `energyCommunityId` mit fremder ID ergibt `403 FORBIDDEN`. Der Admin sieht alles.
    - Einzelressourcen (`/positions/{id}`, `/energy-communities/{id}`): fremde Ressource `403 FORBIDDEN`. Weil IDs zufällige UUIDs sind, wird bewusst in Kauf genommen, dass `404` und `403` unterscheidbar sind.
    - Zugangsdaten einer EG, die nicht `ACTIVE` ist: `403 ENERGY_COMMUNITY_NOT_ACTIVE`, auch bei `GET /me` und `GET /markets`.
    - Reihenfolge der Prüfungen:
      - Login und Registrierung (ohne Anmeldung): `429` (Rate-Limit bzw. Sperre nach Fehlversuchen) → Idempotenz (nur Registrierung) → `400` → `401 INVALID_CREDENTIALS` bzw. `409` → `403 ENERGY_COMMUNITY_NOT_ACTIVE` (nur Login). Eine gesperrte Anmeldung erhält also `429`, auch wenn das Passwort falsch ist.
      - Alle anderen Endpoints: `401` → `429` → `403` (Rolle, EG aktiv) → Idempotenz (nur bei `Idempotency-Key`: Header fehlt oder ungültig `400`, bekannter Key mit gleichem Inhalt gespeicherte Antwort, mit anderem Inhalt `409 IDEMPOTENCY_KEY_REUSED`) → `400` → `404` → `403` (eigene Ressource) → `409`.
    - Passwörter und API-Keys werden nur gehasht gespeichert. Im Klartext erscheinen sie nur einmal in der Antwort von `POST /energy-communities/{id}/credentials`. Außerhalb von `localhost` nur HTTPS.
    - Registrierung und Login sind öffentlich. Die Plattform begrenzt dort die Anfragen und sperrt nach wiederholten Fehlversuchen vorübergehend: `429 RATE_LIMITED` mit Header `Retry-After` (Sekunden). Die genauen Grenzen legt jede Plattform fest und dokumentiert sie.

    ## Statusübergänge bei Marktschluss und Settlement
    Markt:

    | Von | Nach | Auslöser |
    |---|---|---|
    | – | `OPEN` | Betreiber legt den Markt an |
    | `OPEN` | `CLOSED` | Admin ruft `POST /markets/{deliveryDate}/close` auf. Alle `OPEN`-Positionen werden `CLOSED` bzw. `REJECTED` |
    | `CLOSED` | `SETTLED` | Settlement erfolgreich: Zuteilungen, Trades und Ergebnis werden in einem Schritt (atomar) gespeichert |
    | `CLOSED` | `FAILED` | Settlement fehlgeschlagen: Es wird nichts gespeichert, `failureReason` nennt den Grund |
    | `FAILED` | `CLOSED` | Admin ruft `close` erneut auf (neuer Versuch) |

    - Ab `closesAt` lehnt der Server neue, geänderte und stornierte Positionen mit `409 MARKET_CLOSED` ab, auch wenn der Admin den Markt noch nicht geschlossen hat.
    - `closesAt` ist ein realer Zeitpunkt und unabhängig vom `deliveryDate`. Bei Marktläufen mit historischen Liefertagen liegt `closesAt` nach dem Liefertag. Eine Prüfung `closesAt` < `deliveryDate` ist nicht vorgesehen.
    - `close` ist idempotent: Bei `CLOSED` oder `SETTLED` wird nichts neu berechnet. Bei `FAILED` startet ein erneuter Aufruf einen neuen Versuch.
    - `close` antwortet immer mit `200` bei `SETTLED` und mit `202` bei `CLOSED`, auch bei wiederholtem Aufruf. Bei `202` anschließend `GET /markets/{deliveryDate}` abfragen, bis der Status `SETTLED` oder `FAILED` ist.
    - Ergebnisse (`/result`, `/allocations`, `/trades`) gibt es nur bei `SETTLED`, sonst `409 MARKET_NOT_SETTLED`. `SETTLED` ist endgültig.

    Position:

    | Von | Nach | Auslöser |
    |---|---|---|
    | – | `OPEN` | EG reicht die Position ein |
    | `OPEN` | `OPEN` | EG ändert die Position (`PUT`) |
    | `OPEN` | `CANCELLED` | EG storniert vor Marktschluss |
    | `OPEN` | `CLOSED` | Marktschluss, EG ist `ACTIVE` |
    | `OPEN` | `REJECTED` | Marktschluss, EG ist nicht `ACTIVE` |
    | `CLOSED` | `PROCESSED` | Settlement erfolgreich; es gibt eine Zuteilung, eventuell mit 0 kWh |

    `CANCELLED`, `REJECTED` und `PROCESSED` sind Endzustände. Bei `FAILED` bleiben die Positionen `CLOSED`.
    `PUT /positions/{id}` ersetzt Menge und Preisvorstellung. Fehlt `priceExpectationEurPerKwh`, hat die Position danach keine Preisvorstellung mehr.

    ## Beispiele
    - Gültige Beispiele: `flow…` an den Endpoints, als Dateien in `beispiele_v0.3/gueltig/`. Ablauf: Liefertag 2026-11-20, Tagesmarkt, Preise der Gruppe 1 (Ankauf 0,10, Verkauf 0,14, Reserve 0,20 EUR/kWh). Angebote 100 kWh und 50 kWh (Preisvorstellung 0,12, trotzdem gehandelt), Bedarf 170 kWh, Reserve 20 kWh. Ergebnis: Einkauf 15,00 EUR, Verkauf 23,80 EUR, Reserve 4,00 EUR, Marge 4,80 EUR.
    - Ungültige Beispiele: je Fehlercode ein Request mit erwarteter Antwort in `beispiele_v0.3/ungueltig/`.

    ## Validierung
    - IDs: gültige UUID im Format `xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx`; die `id` einer EG vergibt die Plattform
    - `email`: gültige E-Mail-Adresse, höchstens 254 Zeichen, auf einer Plattform nur einmal registrierbar
    - `communityCode`: Kleinbuchstaben, Ziffern und einzelne Bindestriche, 3–40 Zeichen, auf einer Plattform eindeutig
    - `password` (Login): Pflicht, höchstens 128 Zeichen; vergebene Passwörter haben mindestens 8 Zeichen
    - `name`: 1–120 Zeichen, nicht nur Leerzeichen
    - `description` (optional): 1–500 Zeichen
    - `status`: `PENDING`, `ACTIVE` oder `SUSPENDED`; nur der Admin setzt ihn, nur über `PUT /energy-communities/{id}/status`
    - `deliveryDate`: Format `YYYY-MM-DD`, gültiges Kalenderdatum
    - `intervalStart`: nur bei `QUARTER_HOUR`, dort Pflicht; UTC auf voller Viertelstunde im Liefertag
    - `quantityKwh`: größer als 0, höchstens 1.000.000, höchstens 3 Nachkommastellen
    - Preise: 0 bis 100 EUR/kWh, höchstens 5 Nachkommastellen
    - Nachkommastellen prüft der Server und meldet sie als `INVALID_QUANTITY` bzw. `INVALID_PRICE` (Schema-Validatoren prüfen Nachkommastellen unzuverlässig)
    - `priceExpectationEurPerKwh`: optional, nur bei `OFFER`, nur informativ
    - `Idempotency-Key`: UUID; Pflicht bei `POST /positions`
    - Fehlende Pflichtfelder oder unbekannte Felder: `400 VALIDATION_FAILED` mit `details` je Feld

    ## Fehlercodes
    Fehlerformat: `{ "code": "...", "message": "...", "requestId": "...", "details": [{ "field": "/quantityKwh", "code": "...", "message": "..." }] }`

    | HTTP | Code | Bedeutung |
    |---|---|---|
    | 400 | `VALIDATION_FAILED` | Mindestens ein Feld oder Header ist ungültig. |
    | 400 | `INVALID_ID` | Die ID ist keine gültige UUID. |
    | 400 | `INVALID_DELIVERY_DATE` | `deliveryDate` ist kein gültiges Datum im Format `YYYY-MM-DD`. |
    | 400 | `INVALID_INTERVAL` | `intervalStart` fehlt, ist nicht erlaubt oder keine Viertelstunde des Liefertags. |
    | 400 | `INVALID_POSITION_TYPE` | `type` ist nicht `OFFER` oder `DEMAND`. |
    | 400 | `INVALID_QUANTITY` | `quantityKwh` ist nicht größer als 0 oder hat mehr als 3 Nachkommastellen. |
    | 400 | `INVALID_PRICE` | Der Preis liegt nicht zwischen 0 und 100 EUR/kWh oder hat mehr als 5 Nachkommastellen. |
    | 401 | `UNAUTHORIZED` | API-Key oder Token fehlt, ist ungültig oder abgelaufen. |
    | 401 | `INVALID_CREDENTIALS` | E-Mail oder Passwort ist falsch. |
    | 403 | `FORBIDDEN` | Zugriff oder Aktion ist nicht erlaubt. |
    | 403 | `ENERGY_COMMUNITY_NOT_ACTIVE` | Die EG ist nicht aktiv (noch nicht freigeschaltet oder gesperrt). |
    | 404 | `ENERGY_COMMUNITY_NOT_FOUND` | Die EG existiert nicht. |
    | 404 | `POSITION_NOT_FOUND` | Die Position existiert nicht. |
    | 404 | `MARKET_NOT_FOUND` | Für den Liefertag gibt es keinen Markt. |
    | 409 | `EMAIL_ALREADY_REGISTERED` | Mit dieser E-Mail ist schon eine EG registriert. |
    | 409 | `COMMUNITY_CODE_ALREADY_REGISTERED` | Dieser `communityCode` ist schon vergeben. |
    | 409 | `ENERGY_COMMUNITY_IN_USE` | Die EG hat Positionen oder Handelsabschlüsse und kann nicht gelöscht werden. |
    | 409 | `INVALID_STATUS_TRANSITION` | Dieser Statuswechsel ist nicht erlaubt. |
    | 409 | `POSITION_ALREADY_EXISTS` | Für diese EG, diesen Liefertag und dieses Intervall gibt es schon eine Position. |
    | 409 | `POSITION_NOT_MODIFIABLE` | Die Position ist nicht mehr `OPEN` und kann nicht geändert werden. |
    | 409 | `IDEMPOTENCY_KEY_REUSED` | Der `Idempotency-Key` wurde schon mit anderem Inhalt verwendet. |
    | 409 | `MARKET_CLOSED` | Der Markt ist geschlossen oder `closesAt` ist erreicht. |
    | 409 | `MARKET_NOT_SETTLED` | Das Marktergebnis liegt noch nicht vor. |
    | 429 | `RATE_LIMITED` | Zu viele Anfragen; nach `Retry-After` Sekunden erneut versuchen. |
    | 500 | `INTERNAL_ERROR` | Interner Fehler. |
servers:
- url: http://localhost:8080
  description: Lokale Entwicklung
- url: https://{host}
  description: Kubernetes-Cluster. Hostnamen nach dem Schema <gruppe>-<dienst>.machasing.com; die drei Plattform-Hosts trägt
    das Infrastrukturteam ein (offen).
  variables:
    host:
      default: gruppe1-handel.machasing.com
      description: Platzhalter, bis die Hostnamen feststehen
tags:
- name: Authentication
  description: Rolle und Identität zum API-Key
- name: Energy Communities
  description: Verwaltung der Energiegemeinschaften
- name: Positions
  description: Tagesangebot bzw. Tagesbedarf
- name: Markets
  description: Tagesmarkt je Liefertag
- name: Results
  description: Zuteilungen, Handelsabschlüsse, Tagesergebnis
- name: Operations
  description: Kubernetes-Probes
security:
- ApiKeyAuth: []
- BearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Mit E-Mail und Passwort anmelden
      description: 'Rollen: Ohne Anmeldung. EGs, die nicht ACTIVE sind, erhalten 403 ENERGY_COMMUNITY_NOT_ACTIVE.'
      operationId: login
      x-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              flow04_login:
                summary: 'Ablauf 4: EG Sonnenfeld meldet sich an'
                value:
                  email: kontakt@eg-sonnenfeld.example
                  password: <Passwort aus Schritt 3>
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                flow04_login:
                  summary: 'Ablauf 4: Token'
                  value:
                    token: <Token>
                    tokenType: Bearer
                    expiresIn: 3600
                    role: ENERGY_COMMUNITY
                    energyCommunity:
                      id: 3f6c1c8e-5b1f-4c37-a8b1-1c6d9b9d2a10
                      email: kontakt@eg-sonnenfeld.example
                      communityCode: eg-sonnenfeld
                      name: EG Sonnenfeld
                      description: Photovoltaik-Gemeinschaft
                      status: ACTIVE
                      createdAt: '2026-11-17T08:00:00Z'
                      updatedAt: '2026-11-17T09:30:00Z'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Api-Version:
              $ref: '#/components/headers/Api-Version'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_FAILED:
                  $ref: '#/components/examples/VALIDATION_FAILED'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Api-Version:
              $ref: '#/components/headers/Api-Version'
