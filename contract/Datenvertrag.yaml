components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'API-Key für den Systemzugriff. Der Admin vergibt ihn manuell mit POST /energy-communities/{id}/credentials
        und übergibt ihn der EG. Fehlt der Key oder ist er ungültig: 401.'
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Token aus POST /auth/login (E-Mail und Passwort), gedacht für die Web-UI. Header: Authorization: Bearer
        <token>. Das Token läuft nach expiresIn Sekunden ab: 401.'
  parameters:
    EnergyCommunityId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EnergyCommunityId'
    PositionId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PositionId'
    DeliveryDate:
      name: deliveryDate
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DeliveryDate'
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional. Wird in Antwort und Log übernommen.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID, die der Client pro fachlichem Vorgang einmal erzeugt und bei Wiederholungen unverändert mitschickt.
      schema:
        type: string
        format: uuid
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: UUID, die der Client pro fachlichem Vorgang einmal erzeugt und bei Wiederholungen unverändert mitschickt.
      schema:
        type: string
        format: uuid
  schemas:
    EnergyCommunityId:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      examples:
      - 3f6c1c8e-5b1f-4c37-a8b1-1c6d9b9d2a10
    PositionId:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      examples:
      - 6b1a8f3e-2d94-4a77-9c1e-0f5e8a7b1234
    DeliveryDate:
      type: string
      format: date
      pattern: ^\d{4}-\d{2}-\d{2}$
      examples:
      - '2026-11-20'
    Timestamp:
      type: string
      format: date-time
    QuantityKwh:
      type: number
      exclusiveMinimum: 0
      maximum: 1000000
      examples:
      - 120.5
      x-maxDecimals: 3
    QuantityKwhNonNegative:
      type: number
      minimum: 0
      maximum: 1000000
      x-maxDecimals: 3
    PriceEurPerKwh:
      type: number
      minimum: 0
      maximum: 100
      examples:
      - 0.1
      x-maxDecimals: 5
    AmountEur:
      type: number
      x-maxDecimals: 2
    PositionType:
      type: string
      enum:
      - OFFER
      - DEMAND
    PositionStatus:
      type: string
      enum:
      - OPEN
      - CANCELLED
      - CLOSED
      - PROCESSED
      - REJECTED
    MarketStatus:
      type: string
      enum:
      - OPEN
      - CLOSED
      - SETTLED
      - FAILED
    TradeDirection:
      type: string
      enum:
      - PLATFORM_BUYS
      - PLATFORM_SELLS
    ReserveStatus:
      type: string
      enum:
      - NOT_NEEDED
      - COVERED
      - PARTIAL
      - UNAVAILABLE
    ErrorCode:
      type: string
      enum:
      - VALIDATION_FAILED
      - INVALID_ID
      - INVALID_DELIVERY_DATE
      - INVALID_INTERVAL
      - INVALID_POSITION_TYPE
      - INVALID_QUANTITY
      - INVALID_PRICE
      - UNAUTHORIZED
      - INVALID_CREDENTIALS
      - FORBIDDEN
      - ENERGY_COMMUNITY_NOT_ACTIVE
      - ENERGY_COMMUNITY_NOT_FOUND
      - POSITION_NOT_FOUND
      - MARKET_NOT_FOUND
      - EMAIL_ALREADY_REGISTERED
      - COMMUNITY_CODE_ALREADY_REGISTERED
      - ENERGY_COMMUNITY_IN_USE
      - INVALID_STATUS_TRANSITION
      - POSITION_ALREADY_EXISTS
      - POSITION_NOT_MODIFIABLE
      - IDEMPOTENCY_KEY_REUSED
      - MARKET_CLOSED
      - MARKET_NOT_SETTLED
      - RATE_LIMITED
      - INTERNAL_ERROR
    Error:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        requestId:
          type: string
          description: Gleicher Wert wie der Antwort-Header X-Request-Id.
        details:
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
                examples:
                - /quantityKwh
              code:
                $ref: '#/components/schemas/ErrorCode'
              message:
                type: string
    EnergyCommunity:
      type: object
      required:
      - id
      - email
      - communityCode
      - name
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/EnergyCommunityId'
        email:
          type: string
          format: email
          maxLength: 254
        communityCode:
          $ref: '#/components/schemas/CommunityCode'
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/EnergyCommunityStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    PositionRequest:
      type: object
      required:
      - deliveryDate
      - type
      - quantityKwh
      additionalProperties: false
      properties:
        energyCommunityId:
          $ref: '#/components/schemas/EnergyCommunityId'
          description: Optional. Der Server setzt die ID der angemeldeten EG ein. Eine fremde ID ergibt 403 FORBIDDEN.
        deliveryDate:
          $ref: '#/components/schemas/DeliveryDate'
        intervalStart:
          $ref: '#/components/schemas/IntervalStart'
          description: Nur bei QUARTER_HOUR-Märkten, dort Pflicht. Bei DAY-Märkten nicht erlaubt.
        type:
          $ref: '#/components/schemas/PositionType'
        quantityKwh:
          $ref: '#/components/schemas/QuantityKwh'
        priceExpectationEurPerKwh:
          $ref: '#/components/schemas/PriceEurPerKwh'
          description: Nur bei OFFER, optional und nur informativ. Kein Mindestpreis.
      if:
        properties:
          type:
            const: DEMAND
        required:
        - type
      then:
        not:
          required:
          - priceExpectationEurPerKwh
    PositionUpdate:
      type: object
      description: 'Ersetzt Menge und Preisvorstellung. Fehlt priceExpectationEurPerKwh, hat die Position danach keine. priceExpectationEurPerKwh
        ist nur bei einer gespeicherten OFFER-Position zulässig; bei DEMAND mit diesem Feld: 400 VALIDATION_FAILED, die Position
        bleibt unverändert.'
      required:
      - quantityKwh
      additionalProperties: false
      properties:
        quantityKwh:
          $ref: '#/components/schemas/QuantityKwh'
        priceExpectationEurPerKwh:
          $ref: '#/components/schemas/PriceEurPerKwh'
    Position:
      type: object
      required:
      - id
      - energyCommunityId
      - deliveryDate
      - intervalStart
      - type
      - quantityKwh
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/PositionId'
        energyCommunityId:
          $ref: '#/components/schemas/EnergyCommunityId'
        deliveryDate:
          $ref: '#/components/schemas/DeliveryDate'
        intervalStart:
          $ref: '#/components/schemas/IntervalStartOrNull'
        type:
          $ref: '#/components/schemas/PositionType'
        quantityKwh:
          $ref: '#/components/schemas/QuantityKwh'
        priceExpectationEurPerKwh:
          $ref: '#/components/schemas/PriceEurPerKwh'
        status:
          $ref: '#/components/schemas/PositionStatus'
        rejectionReason:
          type:
          - string
          - 'null'
          description: Nur bei REJECTED gesetzt, z. B. ENERGY_COMMUNITY_NOT_ACTIVE.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    Market:
      type: object
      required:
      - deliveryDate
      - resolution
      - status
      - closesAt
      properties:
        deliveryDate:
          $ref: '#/components/schemas/DeliveryDate'
        resolution:
          $ref: '#/components/schemas/MarketResolution'
        status:
          $ref: '#/components/schemas/MarketStatus'
        prices:
          $ref: '#/components/schemas/PriceIndication'
          description: 'Optional: Preisindikation vor Marktschluss (nicht verbindlich).'
        closesAt:
          $ref: '#/components/schemas/Timestamp'
          description: Ab diesem Zeitpunkt werden keine Positionen mehr angenommen, geändert oder storniert. Realer Zeitpunkt, unabhängig vom deliveryDate (bei historischen Liefertagen liegt er danach).
        closedAt:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        settledAt:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        failureReason:
          type:
          - string
          - 'null'
          description: Nur bei FAILED gesetzt.
    Allocation:
      type: object
      required:
      - deliveryDate
      - intervalStart
      - positionId
      - energyCommunityId
      - type
      - requestedKwh
      - allocatedKwh
      - reason
      properties:
        deliveryDate:
          $ref: '#/components/schemas/DeliveryDate'
        intervalStart:
          $ref: '#/components/schemas/IntervalStartOrNull'
        positionId:
          $ref: '#/components/schemas/PositionId'
        energyCommunityId:
          $ref: '#/components/schemas/EnergyCommunityId'
        type:
          $ref: '#/components/schemas/PositionType'
        requestedKwh:
          $ref: '#/components/schemas/QuantityKwh'
        allocatedKwh:
          $ref: '#/components/schemas/QuantityKwhNonNegative'
        reason:
          $ref: '#/components/schemas/AllocationReason'
    Trade:
      type: object
      required:
      - id
      - deliveryDate
      - intervalStart
      - positionId
      - energyCommunityId
      - direction
      - fromReserve
      - quantityKwh
      - priceEurPerKwh
      - amountEur
      - createdAt
      properties:
        id:
          $ref: '#/components/schemas/TradeId'
        deliveryDate:
          $ref: '#/components/schemas/DeliveryDate'
        intervalStart:
          $ref: '#/components/schemas/IntervalStartOrNull'
        positionId:
          $ref: '#/components/schemas/PositionId'
          description: Position, aus der dieser Handelsabschluss entstanden ist.
        energyCommunityId:
          $ref: '#/components/schemas/EnergyCommunityId'
        direction:
          $ref: '#/components/schemas/TradeDirection'
        fromReserve:
          type: boolean
          description: true, wenn die Menge eines Bedarfs aus der Reserve gedeckt wurde (nur bei PLATFORM_SELLS).
        quantityKwh:
          $ref: '#/components/schemas/QuantityKwh'
        priceEurPerKwh:
          $ref: '#/components/schemas/PriceEurPerKwh'
        amountEur:
          $ref: '#/components/schemas/AmountEur'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    Prices:
      type: object
      required:
      - deliveryDate
      - buyPriceEurPerKwh
      - sellPriceEurPerKwh
      - reservePriceEurPerKwh
      properties:
        deliveryDate:
          $ref: '#/components/schemas/DeliveryDate'
        buyPriceEurPerKwh:
          oneOf:
          - $ref: '#/components/schemas/PriceEurPerKwh'
          - type: 'null'
        sellPriceEurPerKwh:
          oneOf:
          - $ref: '#/components/schemas/PriceEurPerKwh'
          - type: 'null'
        reservePriceEurPerKwh:
          oneOf:
          - $ref: '#/components/schemas/PriceEurPerKwh'
          - type: 'null'
      description: Durchschnittspreise des Liefertags, gewichtet nach Menge. null, wenn es in dieser Richtung kein Geschäft
        bzw. keine Reserve gab.
    Reserve:
      type: object
      required:
      - deliveryDate
      - status
      - requiredKwh
      - dispatchedKwh
      - costEur
      properties:
        deliveryDate:
          $ref: '#/components/schemas/DeliveryDate'
        status:
          $ref: '#/components/schemas/ReserveStatus'
        requiredKwh:
          $ref: '#/components/schemas/QuantityKwhTotal'
          description: max(D - S, 0)
        dispatchedKwh:
          $ref: '#/components/schemas/QuantityKwhTotal'
        priceEurPerKwh:
          oneOf:
          - $ref: '#/components/schemas/PriceEurPerKwh'
          - type: 'null'
        costEur:
          $ref: '#/components/schemas/AmountEur'
    MarketResult:
      type: object
      required:
      - deliveryDate
      - resolution
      - status
      - settledAt
      - totalOfferedKwh
      - totalDemandKwh
      - totalPurchasedKwh
      - totalSoldKwh
      - reserve
      - prices
      - purchaseCostEur
      - salesRevenueEur
      - marginEur
      properties:
        deliveryDate:
          $ref: '#/components/schemas/DeliveryDate'
        resolution:
          $ref: '#/components/schemas/MarketResolution'
        status:
          $ref: '#/components/schemas/MarketStatus'
        settledAt:
          $ref: '#/components/schemas/Timestamp'
        ruleVersion:
          type: string
          maxLength: 64
          description: 'Optional: Version der Preis- und Zuteilungsregel der Plattform, mit der gerechnet wurde.'
          examples:
          - gruppe1-prorata-1.0
        totalOfferedKwh:
          $ref: '#/components/schemas/QuantityKwhTotal'
          description: 'S: Summe aller Angebote, die beim Marktschluss CLOSED wurden (nach dem Settlement PROCESSED).'
        totalDemandKwh:
          $ref: '#/components/schemas/QuantityKwhTotal'
          description: 'D: Summe aller Bedarfe, die beim Marktschluss CLOSED wurden (nach dem Settlement PROCESSED).'
        totalPurchasedKwh:
          $ref: '#/components/schemas/QuantityKwhTotal'
        totalSoldKwh:
          $ref: '#/components/schemas/QuantityKwhTotal'
        reserve:
          $ref: '#/components/schemas/Reserve'
        prices:
          $ref: '#/components/schemas/Prices'
          description: Durchschnittspreise des Tages (siehe Prices).
        purchaseCostEur:
          $ref: '#/components/schemas/AmountEur'
        salesRevenueEur:
          $ref: '#/components/schemas/AmountEur'
        marginEur:
          $ref: '#/components/schemas/AmountEur'
          description: salesRevenueEur - purchaseCostEur - reserve.costEur
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/IntervalResult'
          description: 'Nur bei QUARTER_HOUR: Ergebnis je Intervall. Die Felder auf oberster Ebene sind die Tagessummen.'
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
        checks:
          type: object
          additionalProperties:
            type: string
            enum:
            - UP
            - DOWN
          examples:
          - database: UP
    TradeId:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      examples:
      - 9d2e7a41-0c55-4b8e-9a3f-52c1d8e4f7b6
    EnergyCommunityStatus:
      type: string
      enum:
      - PENDING
      - ACTIVE
      - SUSPENDED
    EnergyCommunityUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
        description:
          type: string
          minLength: 1
          maxLength: 500
      description: Profil bearbeiten. status und communityCode sind hier nicht erlaubt (400 VALIDATION_FAILED).
    Me:
      type: object
      required:
      - role
      properties:
        role:
          type: string
          enum:
          - ADMIN
          - ENERGY_COMMUNITY
        energyCommunity:
          $ref: '#/components/schemas/EnergyCommunity'
    EnergyCommunityRegistration:
      type: object
      required:
      - email
      - communityCode
      - name
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        communityCode:
          $ref: '#/components/schemas/CommunityCode'
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
        description:
          type: string
          minLength: 1
          maxLength: 500
    LoginRequest:
      type: object
      required:
      - email
      - password
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    LoginResponse:
      type: object
      required:
      - token
      - tokenType
      - expiresIn
      - role
      properties:
        token:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: Gültigkeit in Sekunden
        role:
          type: string
          enum:
          - ADMIN
          - ENERGY_COMMUNITY
        energyCommunity:
          $ref: '#/components/schemas/EnergyCommunity'
    Credentials:
      type: object
      required:
      - apiKey
      - password
      properties:
        apiKey:
          type: string
        password:
          type: string
    MarketResolution:
      type: string
      enum:
      - DAY
      - QUARTER_HOUR
      description: Zeitliche Auflösung des Markts. DAY = Tagesmarkt (verbindlicher Standard), QUARTER_HOUR = 15-Minuten-Intervalle
        (optionale Erweiterung).
    IntervalStart:
      type: string
      format: date-time
      pattern: ^\d{4}-\d{2}-\d{2}T\d{2}:(00|15|30|45):00(\.0+)?Z$
      description: Beginn des 15-Minuten-Intervalls in UTC (nur bei QUARTER_HOUR).
      examples:
      - '2026-11-20T11:15:00Z'
    IntervalStartOrNull:
      oneOf:
      - $ref: '#/components/schemas/IntervalStart'
      - type: 'null'
      description: Beginn des Lieferintervalls; null im Tagesmarkt (DAY).
    AllocationReason:
      type: string
      enum:
      - FULLY_ALLOCATED
      - PARTIALLY_ALLOCATED
      - NOT_ALLOCATED
      - NOT_NEEDED
      - RESERVE_SHORTAGE
      description: 'FULLY_ALLOCATED: volle Menge. PARTIALLY_ALLOCATED: Angebot wegen Überangebot nur teilweise gekauft. NOT_ALLOCATED:
        Angebot wegen Überangebot gar nicht gekauft (nach der Zuteilungsregel der Plattform). NOT_NEEDED: es gab keinen Bedarf.
        RESERVE_SHORTAGE: Bedarf gekürzt, weil die Reserve nicht reichte.'
    IntervalResult:
      type: object
      required:
      - intervalStart
      - totalOfferedKwh
      - totalDemandKwh
      - totalPurchasedKwh
      - totalSoldKwh
      - reserve
      properties:
        intervalStart:
          $ref: '#/components/schemas/IntervalStart'
        totalOfferedKwh:
          $ref: '#/components/schemas/QuantityKwhTotal'
        totalDemandKwh:
          $ref: '#/components/schemas/QuantityKwhTotal'
        totalPurchasedKwh:
          $ref: '#/components/schemas/QuantityKwhTotal'
        totalSoldKwh:
          $ref: '#/components/schemas/QuantityKwhTotal'
        reserve:
          $ref: '#/components/schemas/Reserve'
    EnergyCommunityStatusUpdate:
      type: object
      required:
      - status
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/EnergyCommunityStatus'
    CommunityCode:
      type: string
      minLength: 3
      maxLength: 40
      pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      description: Plattformübergreifende Kennung der EG (Vorschlag). Unveränderlich, pro Plattform eindeutig.
      examples:
      - eg-mmm
    QuantityKwhTotal:
      type: number
      minimum: 0
      x-maxDecimals: 3
      description: Summe über mehrere Positionen; ohne Obergrenze.
    PriceIndication:
      type: object
      required:
      - deliveryDate
      - buyPriceEurPerKwh
      - sellPriceEurPerKwh
      - reservePriceEurPerKwh
      properties:
        deliveryDate:
          $ref: '#/components/schemas/DeliveryDate'
        buyPriceEurPerKwh:
          $ref: '#/components/schemas/PriceEurPerKwh'
        sellPriceEurPerKwh:
          $ref: '#/components/schemas/PriceEurPerKwh'
        reservePriceEurPerKwh:
          $ref: '#/components/schemas/PriceEurPerKwh'
      description: Optionale Preisindikation vor Marktschluss, nicht verbindlich. Plattformen mit festen Preisen geben hier
        ihre festen Preise an.
  examples:
    COMMUNITY_CODE_ALREADY_REGISTERED:
      summary: 409 COMMUNITY_CODE_ALREADY_REGISTERED
      value:
        code: COMMUNITY_CODE_ALREADY_REGISTERED
        message: This communityCode is already registered.
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    EMAIL_ALREADY_REGISTERED:
      summary: 409 EMAIL_ALREADY_REGISTERED
      value:
        code: EMAIL_ALREADY_REGISTERED
        message: An energy community with this email is already registered.
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    ENERGY_COMMUNITY_IN_USE:
      summary: 409 ENERGY_COMMUNITY_IN_USE
      value:
        code: ENERGY_COMMUNITY_IN_USE
        message: The energy community cannot be deleted because it has positions or trades.
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    ENERGY_COMMUNITY_NOT_ACTIVE:
      summary: 403 ENERGY_COMMUNITY_NOT_ACTIVE
      value:
        code: ENERGY_COMMUNITY_NOT_ACTIVE
        message: The energy community is not active (pending approval or suspended).
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    ENERGY_COMMUNITY_NOT_FOUND:
      summary: 404 ENERGY_COMMUNITY_NOT_FOUND
      value:
        code: ENERGY_COMMUNITY_NOT_FOUND
        message: The energy community does not exist.
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    FORBIDDEN:
      summary: 403 FORBIDDEN
      value:
        code: FORBIDDEN
        message: You are not allowed to access this resource or perform this action.
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    FORBIDDEN_FOREIGN_ENERGY_COMMUNITY:
      summary: 403 FORBIDDEN (fremde energyCommunityId)
      value:
        code: FORBIDDEN
        message: energyCommunityId does not belong to the authenticated energy community.
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    IDEMPOTENCY_KEY_REUSED:
      summary: 409 IDEMPOTENCY_KEY_REUSED
      value:
        code: IDEMPOTENCY_KEY_REUSED
        message: The Idempotency-Key was already used with a different request.
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    INTERNAL_ERROR:
      summary: 500 INTERNAL_ERROR
      value:
        code: INTERNAL_ERROR
        message: Internal error.
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    INVALID_CREDENTIALS:
      summary: 401 INVALID_CREDENTIALS
      value:
        code: INVALID_CREDENTIALS
        message: Email or password is wrong.
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    INVALID_DELIVERY_DATE:
      summary: 400 INVALID_DELIVERY_DATE
      value:
        code: INVALID_DELIVERY_DATE
        message: deliveryDate must be in the format YYYY-MM-DD.
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    INVALID_ID:
      summary: 400 INVALID_ID
      value:
        code: INVALID_ID
        message: The ID is not a valid UUID.
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    INVALID_INTERVAL:
      summary: 400 INVALID_INTERVAL
      value:
        code: INVALID_INTERVAL
        message: intervalStart is missing, not allowed or not a quarter hour of the delivery day.
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    INVALID_POSITION_TYPE:
      summary: 400 INVALID_POSITION_TYPE
      value:
        code: INVALID_POSITION_TYPE
        message: type must be OFFER or DEMAND.
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    INVALID_PRICE:
      summary: 400 INVALID_PRICE
      value:
        code: INVALID_PRICE
        message: The price must be between 0 and 100 EUR/kWh (max. 5 decimal places).
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    INVALID_QUANTITY:
      summary: 400 INVALID_QUANTITY
      value:
        code: INVALID_QUANTITY
        message: quantityKwh must be greater than 0 (max. 3 decimal places).
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    INVALID_STATUS_TRANSITION:
      summary: 409 INVALID_STATUS_TRANSITION
      value:
        code: INVALID_STATUS_TRANSITION
        message: This status change is not allowed.
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    MARKET_CLOSED:
      summary: 409 MARKET_CLOSED
      value:
        code: MARKET_CLOSED
        message: The market is already closed.
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    MARKET_NOT_FOUND:
      summary: 404 MARKET_NOT_FOUND
      value:
        code: MARKET_NOT_FOUND
        message: No market exists for the delivery date.
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    MARKET_NOT_SETTLED:
      summary: 409 MARKET_NOT_SETTLED
      value:
        code: MARKET_NOT_SETTLED
        message: The market result is not available yet.
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    POSITION_ALREADY_EXISTS:
      summary: 409 POSITION_ALREADY_EXISTS
      value:
        code: POSITION_ALREADY_EXISTS
        message: A position already exists for this energy community, delivery date and interval.
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    POSITION_NOT_FOUND:
      summary: 404 POSITION_NOT_FOUND
      value:
        code: POSITION_NOT_FOUND
        message: The position does not exist.
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    POSITION_NOT_MODIFIABLE:
      summary: 409 POSITION_NOT_MODIFIABLE
      value:
        code: POSITION_NOT_MODIFIABLE
        message: The position is no longer OPEN and can no longer be changed.
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    RATE_LIMITED:
      summary: 429 RATE_LIMITED
      value:
        code: RATE_LIMITED
        message: Too many requests. Retry after the time given in Retry-After.
        requestId: 5c0e8a52-3b1d-4f6e-9a27-d84c1b7e6f30
    UNAUTHORIZED:
      summary: 401 UNAUTHORIZED
      value:
        code: UNAUTHORIZED
