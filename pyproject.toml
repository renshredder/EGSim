[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egsim"
version = "0.2.0"
description = "Konfigurierbare Dummy-Energiegemeinschaften zum Testen der Handelsplattform-API (Datenvertrag 0.3.1)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "tzdata; sys_platform == 'win32'",   # Windows hat keine Zeitzonen-Datenbank (Europe/Vienna)
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
egsim = "egsim.cli:main"

[tool.setuptools.packages.find]
include = ["egsim*"]

[tool.setuptools.package-data]
"egsim" = ["contract.json"]
"egsim.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
